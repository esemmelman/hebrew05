<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hebrew vowels · Same sound, different signs</title>
  <meta name="description" content="A simple chart of Hebrew vowels grouped by their shared sounds in modern Israeli Hebrew.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="sidebar" aria-label="Pages">
    <select id="page-list" size="2" aria-label="Choose page">
      <option value="first" selected>First</option>
      <option value="second">Second</option>
    </select>
  </nav>
  <main>
    <div id="first-page">
    <section id="groups" aria-label="Hebrew vowels grouped by sound"></section>
    <aside><span class="shva" lang="he">אְ</span><p><strong>And then there’s shva.</strong> <span lang="he">ְ</span> can be silent or sound like a short “eh,” depending on the word.</p></aside>
    <footer><p>Modern Israeli pronunciation. Other reading traditions may differ.<br>Kamatz usually sounds like “ah”; kamatz katan sounds like “oh.”</p><a href="https://hebrew.laits.utexas.edu/drupal/themes/hebrewgrid/bh/bhonline/grammar/vowels.pdf" target="_blank" rel="noopener">Vowel reference ↗</a></footer>
    </div>
    <section id="second-page" class="practice" aria-label="Vowel practice" hidden>
      <button id="practice-card" type="button" aria-label="Reveal English sound"><span id="practice-content" lang="he"></span></button>
      <button id="next-vowel" type="button">Next</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
